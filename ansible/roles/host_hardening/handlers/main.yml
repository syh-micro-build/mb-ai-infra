- name: Host hardening load sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Host hardening reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Host hardening restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode or ansible_facts.services.get('fail2ban.service', {}).get('status', 'not-found') != 'not-found'

- name: Host hardening load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
