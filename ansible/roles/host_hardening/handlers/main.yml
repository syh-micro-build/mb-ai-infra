- name: Host hardening load sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Host hardening reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Host hardening restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode or 'fail2ban.service' in ansible_facts.services

- name: Host hardening load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
