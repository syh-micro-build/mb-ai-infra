- name: Require a non-root deployment account
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - ansible_user != 'root'
      - ansible_user is match('^[a-z_][a-z0-9_-]*$')
      - ansible_password | default('') | length == 0
      - ansible_ssh_pass | default('') | length == 0
    fail_msg: Create and verify a sudo account with SSH public-key access before applying the SSH baseline.

- name: Resolve deployment account home
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Inspect account public keys
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
  register: host_hardening_keys

- name: Require existing public-key authentication material
  ansible.builtin.assert:
    that:
      - host_hardening_keys.stat.exists
      - host_hardening_keys.stat.size | default(0) > 0

- name: Read the actual connecting peer without sudo
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: host_hardening_connection
  changed_when: false
  check_mode: false

- name: Protect the current administrator from firewall lockout
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import ipaddress,json,sys; d=json.load(sys.stdin); p=ipaddress.ip_address(d['peer']);
        assert any(p in ipaddress.ip_network(c, strict=False) for c in d['cidrs']), 'SSH peer is outside admin_cidrs'
    stdin: "{{ {'peer': host_hardening_connection.stdout.split()[0], 'cidrs': infra_config.admin_cidrs} | to_json }}"
  changed_when: false
  check_mode: false

- name: Install host security packages
  ansible.builtin.apt:
    name: [ufw, iptables, fail2ban, auditd, unattended-upgrades, openssh-server, curl, openssl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install conservative kernel baseline without changing Docker forwarding
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../security/baseline/60-mb-ai-infra.conf"
    dest: /etc/sysctl.d/60-mb-ai-infra.conf
    mode: '0644'
  notify: Host hardening load sysctl

- name: Install SSH drop-in
  ansible.builtin.template:
    src: ssh.conf.j2
    dest: /etc/ssh/sshd_config.d/00-mb-ai-infra.conf
    mode: '0644'
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Host hardening reload ssh

- name: Configure SSH brute-force protection
  ansible.builtin.template:
    src: fail2ban.conf.j2
    dest: /etc/fail2ban/jail.d/mb-ai-infra.local
    mode: '0644'
  notify: Host hardening restart fail2ban

- name: Configure infrastructure audit rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../security/baseline/audit.rules"
    dest: /etc/audit/rules.d/mb-ai-infra.rules
    mode: '0640'
  notify: Host hardening load audit rules

- name: Configure security-only unattended upgrades without automatic reboot
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../security/baseline/52-mb-ai-infra-upgrades"
    dest: /etc/apt/apt.conf.d/52-mb-ai-infra-upgrades
    mode: '0644'

- name: Enable audit and brute-force protection
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [auditd, fail2ban]

- name: Stop only explicitly declared legacy web services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ infra_legacy_services }}"
