- name: Explicitly adopt existing certificate renewal to the Infra webroot
  hosts: mb_ai
  become: true
  gather_facts: true
  serial: 1
  roles: [preflight]
  tasks:
    - name: Inspect Certbot version
      ansible.builtin.command: certbot --version
      register: tls_adopt_version
      changed_when: false
      check_mode: false
    - name: Require safe renewal reconfiguration support
      ansible.builtin.assert:
        that: tls_adopt_version.stdout.split()[-1] is version('2.3.0', '>=')
        fail_msg: Ubuntu 22.04's older Certbot requires an explicit dry-run and one forced renewal; follow docs/tls.md.
    - name: Test and save the selected certificate renewal webroot
      ansible.builtin.command:
        argv: [certbot, reconfigure, --cert-name, "{{ infra_config.domain }}", --webroot, --webroot-path, "{{ infra_config.acme_root }}"]
      changed_when: true
      when: not ansible_check_mode
