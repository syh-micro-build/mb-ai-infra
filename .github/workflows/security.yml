name: Security
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
  nginx:
    name: Pinned Nginx image vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Read the exact runtime image
        id: image
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('ansible/vars/defaults.yml').read_text()
          image = re.search(r'^  nginx_image: (nginx:[^\s]+)$', text, re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ref=' + image + '\n')
          PY
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
