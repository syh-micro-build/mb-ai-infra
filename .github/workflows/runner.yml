name: Runner
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Runner and SSH bootstrap integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the controller image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -f runner/Dockerfile -t mb-ai-infra-runner:test .
      - name: Show the packaged toolchain
        run: docker run --rm --read-only --cap-drop ALL mb-ai-infra-runner:test version
      - name: Run unit and CLI contracts inside the packaged control environment
        run: |
          # CLI unit fixtures create executable mock commands only in this test container.
          docker run --rm --read-only --cap-drop ALL --tmpfs /tmp:rw,exec,mode=1777 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" --entrypoint python3 \
            mb-ai-infra-runner:test -m unittest discover -s tests -v
      - name: Test the CLI and real SSH managed nodes without Python
        run: bash ci/runner-integration.sh mb-ai-infra-runner:test
      - name: Bootstrap over real SSH with password-required sudo
        run: bash ci/runner-integration.sh mb-ai-infra-runner:test password
      - name: Scan the built Runner for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          image-ref: mb-ai-infra-runner:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  check:
    name: Ubuntu ${{ matrix.ubuntu }} full check (${{ matrix.sudo }} sudo)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22', '24']
        sudo: [password, nopasswd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the same controller toolchain
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -f runner/Dockerfile -t mb-ai-infra-runner:test .
      - name: Plan through actual SSH, sudo, systemd and Docker without applying host changes
        env:
          UBUNTU: ${{ matrix.ubuntu }}
          SUDO_MODE: ${{ matrix.sudo }}
        run: bash ci/check-integration.sh mb-ai-infra-runner:test "$UBUNTU" "$SUDO_MODE"
  publish:
    name: Publish the validated Runner to GHCR
    needs: [test, check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Select immutable commit and explicit release tags
        id: tags
        env:
          REF: ${{ github.ref }}
          REVISION: ${{ github.sha }}
        run: |
          image=ghcr.io/syh-micro-build/mb-ai-infra-runner
          tags="$image:sha-$REVISION"
          if [[ "$REF" == refs/heads/main ]]; then
            tags="$tags,$image:main"
          else
            version="$(cat VERSION)"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$REF" == "refs/tags/v$version" ]]
            tags="$tags,$image:$version"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          provenance: true
          sbom: true
