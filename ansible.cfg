[defaults]
roles_path = ./ansible/roles
collections_path = ./.cache/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 20

[ssh_connection]
# Password-required sudo is a supported default; retain SSH connection reuse.
pipelining = False
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
